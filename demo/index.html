<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Filter Card demo</title>
<!--
  Local demo with a fake Home Assistant connection and made-up entities.
  Open this file in a browser to try the card without Home Assistant.
  Add ?lang=de for German, ?editor=1 to show the card editor.
-->
<!-- The icon font must be loaded globally; @font-face inside shadow roots is ignored -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  :root {
    --primary-color: #03a9f4; --accent-color: #ff9800; --primary-text-color: #212121; --secondary-text-color: #727272;
    --text-primary-color: #fff; --divider-color: rgba(0,0,0,.12); --card-background-color: #fff;
    --secondary-background-color: #f5f5f5; --error-color: #db4437; --warning-color: #ffa600; --success-color: #43a047;
    --disabled-text-color: #9e9e9e; --state-icon-color: #44739e;
  }
  body { margin: 0; padding: 16px; background: #fafafa; font-family: Roboto, "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  dashboard-filter-card { display: block; background: var(--card-background-color); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.15); overflow: hidden; }
  ha-card { display: block; background: var(--card-background-color); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .editor { display: block; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.15); max-width: 420px; margin: 0; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
// Minimal stand-ins for Home Assistant components
customElements.define('ha-card', class extends HTMLElement {});
customElements.define('ha-icon', class extends HTMLElement {
  static get observedAttributes() { return ['icon']; }
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML =
      '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">' +
      '<style>:host{display:inline-flex}i{font-size:22px;line-height:1}</style><i></i>';
  }
  set icon(v) { this.setAttribute('icon', v); }
  attributeChangedCallback() {
    this.shadowRoot.querySelector('i').className = 'mdi mdi-' + (this.getAttribute('icon') || '').replace('mdi:', '');
  }
});

const params = new URLSearchParams(location.search);
const st = (entity_id, state, attributes) => ({ entity_id, state, attributes });
const states = Object.fromEntries([
  st('light.living_room', 'on', { friendly_name: 'Living room ceiling' }),
  st('light.kitchen', 'off', { friendly_name: 'Kitchen light' }),
  st('light.kids_room', 'on', { friendly_name: 'Kids room light' }),
  st('switch.tv', 'off', { friendly_name: 'TV', icon: 'mdi:television' }),
  st('cover.living_room_blinds', 'open', { friendly_name: 'Living room blinds' }),
  st('climate.kids_room', 'heat', { friendly_name: 'Kids room thermostat' }),
  st('lock.front_door', 'locked', { friendly_name: 'Front door' }),
  st('sensor.outdoor_temperature', '12.4', { friendly_name: 'Outdoor temperature', unit_of_measurement: '°C', icon: 'mdi:thermometer' }),
  st('sensor.kids_room_temperature', '21.2', { friendly_name: 'Kids room temperature', unit_of_measurement: '°C', icon: 'mdi:thermometer' }),
  st('media_player.kids_speaker', 'playing', { friendly_name: 'Kids room speaker' }),
  st('alarm_control_panel.home', 'disarmed', { friendly_name: 'Alarm system' }),
  st('input_boolean.guest_mode', 'off', { friendly_name: 'Guest mode' }),
  st('weather.home', 'cloudy', { friendly_name: 'Weather' }),
  st('cover.garage_door', 'closed', { friendly_name: 'Garage door', icon: 'mdi:garage' }),
  st('person.parent', 'home', { friendly_name: 'Parent' }),
].map((s) => [s.entity_id, s]));

const floorPlan = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240"><rect width="400" height="240" fill="#eef2f6"/>' +
  '<g fill="none" stroke="#90a4ae" stroke-width="4"><rect x="10" y="10" width="380" height="220"/><path d="M200 10v140M10 150h260M270 150v80"/></g></svg>');

const sources = {
  lovelace: {
    views: [
      {
        title: 'Home', path: 'home', type: 'sections',
        badges: [{ type: 'entity', entity: 'person.parent' }, { type: 'entity', entity: 'sensor.outdoor_temperature' }],
        sections: [
          { type: 'grid', cards: [
            { type: 'heading', heading: 'Living room' },
            { type: 'tile', entity: 'light.living_room', features: [{ type: 'light-brightness' }] },
            { type: 'tile', entity: 'cover.living_room_blinds' },
            { type: 'tile', entity: 'switch.tv' },
            { type: 'media-control', entity: 'media_player.kids_speaker' },
          ] },
          { type: 'grid', cards: [
            { type: 'heading', heading: 'Kids room' },
            { type: 'tile', entity: 'light.kids_room' },
            { type: 'thermostat', entity: 'climate.kids_room' },
            { type: 'entities', entities: ['sensor.kids_room_temperature', 'input_boolean.guest_mode'] },
          ] },
          { type: 'grid', cards: [
            { type: 'heading', heading: 'Security' },
            { type: 'tile', entity: 'lock.front_door' },
            { type: 'alarm-panel', entity: 'alarm_control_panel.home' },
            { type: 'button', entity: 'cover.garage_door', tap_action: { action: 'toggle' } },
          ] },
        ],
      },
      {
        title: 'Floor plan', path: 'floor-plan',
        cards: [{
          type: 'picture-elements', image: floorPlan,
          elements: [
            { type: 'state-icon', entity: 'light.living_room', style: { left: '25%', top: '35%' } },
            { type: 'state-icon', entity: 'light.kitchen', style: { left: '75%', top: '35%' } },
            { type: 'state-label', entity: 'sensor.kids_room_temperature', style: { left: '20%', top: '80%' } },
            { type: 'state-icon', entity: 'lock.front_door', style: { left: '85%', top: '85%' } },
            { type: 'service-button', title: 'All off', action: 'light.turn_off', data: { entity_id: 'all' }, style: { left: '50%', top: '92%' } },
          ],
        }, { type: 'weather-forecast', entity: 'weather.home' }],
      },
      { title: 'Energy', path: 'energy', cards: [{ type: 'markdown', content: 'Energy overview' }] },
    ],
  },
};

const saved = {};
const dashboards = [{ url_path: 'lovelace', title: 'Overview', mode: 'storage' }];
if (params.get('existing') !== '0') {
  dashboards.push({ url_path: 'dashboard-kids', title: 'Kids', mode: 'storage' });
  // A previous selection, so the screenshot shows the different modes
  saved['dashboard-kids'] = {
    dashboard_filter_card: {
      views: { home: true, 'floor-plan': true },
      entities: {
        'light.living_room': 'control', 'light.kids_room': 'control', 'cover.living_room_blinds': 'show',
        'switch.tv': 'hide', 'media_player.kids_speaker': 'control', 'climate.kids_room': 'show',
        'sensor.kids_room_temperature': 'show', 'input_boolean.guest_mode': 'hide', 'lock.front_door': 'show',
        'alarm_control_panel.home': 'hide', 'person.parent': 'show', 'sensor.outdoor_temperature': 'show',
        'light.kitchen': 'hide', 'weather.home': 'show',
      },
      updated: new Date(Date.now() - 3 * 86400e3).toISOString(),
    },
    views: [],
  };
}

const hass = {
  states,
  user: { is_admin: params.get('admin') !== '0' },
  language: params.get('lang') || 'en',
  locale: { language: params.get('lang') || 'en' },
  async callWS(msg) {
    await new Promise((r) => setTimeout(r, 50));
    if (msg.type === 'lovelace/dashboards/list') return dashboards;
    if (msg.type === 'lovelace/dashboards/create') { dashboards.push({ url_path: msg.url_path, title: msg.title, mode: 'storage' }); return {}; }
    if (msg.type === 'lovelace/config') {
      const key = msg.url_path || 'lovelace';
      const cfg = sources[key] || saved[key];
      if (!cfg) throw { code: 'config_not_found', message: 'No config found.' };
      return JSON.parse(JSON.stringify(cfg));
    }
    if (msg.type === 'lovelace/config/save') { saved[msg.url_path] = msg.config; window.lastSaved = msg.config; return null; }
    throw { code: 'unknown_command', message: msg.type };
  },
};
window.demoHass = hass;

const s = document.createElement('script');
s.src = '../dashboard-filter-card.js';
s.onload = () => {
  const wrap = document.getElementById('wrap');
  const config = { type: 'dashboard-filter-card', source: 'lovelace', target: params.get('target') || 'dashboard-kids', target_title: 'Kids', title: 'Kids dashboard' };
  if (params.get('editor')) {
    const ed = document.createElement('dashboard-filter-card-editor');
    ed.className = 'editor';
    ed.setConfig(config);
    ed.hass = hass;
    ed.addEventListener('config-changed', (e) => console.log('config-changed', e.detail.config));
    wrap.appendChild(ed);
  } else {
    const card = document.createElement('dashboard-filter-card');
    card.setConfig(config);
    card.hass = hass;
    wrap.appendChild(card);
    // ?filter=new preselects a filter (used for the README screenshots)
    if (params.get('filter')) {
      setTimeout(() => {
        const f = card.shadowRoot.querySelector('.filter');
        f.value = params.get('filter');
        f.dispatchEvent(new Event('change'));
      }, 800);
    }
  }
};
document.body.appendChild(s);
</script>
</body>
</html>
