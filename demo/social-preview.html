<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview</title>
<!-- Source for images/social-preview.png (GitHub social preview, 1280x640) -->
<style>
  html, body { margin: 0; width: 1280px; height: 640px; }
  body { display: flex; align-items: center; gap: 72px; padding: 0 110px; box-sizing: border-box;
         background: #F5F7FA; font-family: Roboto, "Segoe UI", system-ui, sans-serif; color: #1C1F24; }
  img { width: 300px; height: 300px; flex: none; }
  h1 { font-size: 76px; font-weight: 600; margin: 0 0 20px; letter-spacing: -1px; line-height: 1.05; }
  p { font-size: 34px; margin: 0; color: #4A5260; line-height: 1.35; }
  .modes { margin-top: 32px; display: flex; gap: 14px; font-size: 26px; font-weight: 500; }
  .modes span { padding: 8px 18px; border-radius: 10px; color: #fff; }
</style>
</head>
<body>
  <img src="../images/logo.svg" alt="">
  <div>
    <h1>Dashboard Filter Card</h1>
    <p>Restricted copies of a Home Assistant dashboard for kids, guests or wall tablets.</p>
    <div class="modes">
      <span style="background:#9E9E9E">Hidden</span>
      <span style="background:#FFA600">Read-only</span>
      <span style="background:#43A047">Full access</span>
    </div>
  </div>
</body>
</html>
